<!doctype html>

<!--              Simple HTML page to display a piece icon               -->
<!--           Shows a large version and an actual size version          -->
<!-- Substitute the code in the SVG <g> tag to display a different icon  -->

    <html lang="en">
<head>
<meta charset="utf-8">
<title>Icon Preview</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #2f3f4f;
  }
  svg {
    display: block;
    width: 50vw;
    height: 50vw;
    margin: 0 auto;
  }
</style>
</head>
<body>
<svg id="icon-scene" viewBox="-20 -20 40 40" preserveAspectRatio="xMidYMid meet"></svg>
<script>
  // Hardcode ICON to preview a different piece icon, prototype, or in-progress change.

  // Eagle, version 2, with larger head.
  const ICON = `
    <g>
      <symbol id="x-icon-e-b" viewBox="-20 -20 40 40">
        <circle cx="0" cy="0" r="19" fill="#6f6f60" stroke="#000000" stroke-width="2" />
      </symbol>
      <use href="#x-icon-e-b" x="-20" y="-20" width="40" height="40" />
      <symbol id="x-icon-e-b-overlay" viewBox="0 0 100 100">
        <path
          d="M 40 60 L 38 52 L 32 45 L 18 47 L 16 58
            A 18 18 0 0 1 16 30 L 26 25 A 30 20 0 0 1 80 20 L 95 40
            L 82 37 L 90 50 L 75 40
            L 80 55 L 67 50 L 65 60
            L 95 60 A 40 30 0 0 1 60 80 L 70 90
            A 50 50 0 0 1 30 90
            L 40 80 A 40 30 0 0 1 5 60 Z"
          fill="#333333"
        />
        <circle cx="42" cy="28" r="5" fill="#6f6f60"/>
      </symbol>
      <use href="#x-icon-e-b-overlay" x="-19" y="-19" width="38" height="38" />
    </g>
    <g transform="translate(16,-16) scale(0.0625)">
      <use href="#x-icon-e-b" x="-20" y="-20" width="40" height="40" />
      <use href="#x-icon-e-b-overlay" x="-19" y="-19" width="38" height="38" />
    </g>
  `;

  document.getElementById("icon-scene").innerHTML = ICON;
</script>
</body>
</html>
