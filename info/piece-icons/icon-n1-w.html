<!doctype html>

<!--              Simple HTML page to display a piece icon               -->
<!--           Shows a large version and an actual size version          -->
<!-- Substitute the code in the SVG <g> tag to display a different icon  -->

<html lang="en">
<head>
<meta charset="utf-8">
<title>Icon Preview</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #2f3f4f;
  }
  svg {
    display: block;
    width: 50vw;
    height: 50vw;
    margin: 0 auto;
  }
</style>
</head>
<body>
<svg id="icon-scene" viewBox="-20 -20 40 40" preserveAspectRatio="xMidYMid meet"></svg>
<script>

  // White Knight version 1.
const ICON = `
  <g>
    <symbol id="x-icon-n-w" viewBox="-20 -20 40 40">
      <circle cx="0" cy="0" r="19" fill="#6f6f60" stroke="#000000" stroke-width="2" />
    </symbol>
    <use href="#x-icon-n-w" x="-20" y="-20" width="40" height="40" />
    <symbol id="x-icon-n-w-overlay" viewBox="0 0 100 100">
        <path
          d="M 20 85 L 30 70 L 54 55 L 50 45 L 35 45 L 22 55
            A 10 10 0 0 1 7 42 L 20 25 A 15 15 0 0 1 40 15
            L 45 7 L 50 15 A 35 35 0 0 1 90 50 L 90 65 L 75 85 Z"
          fill="#cccccc"
        />
        <circle cx="32" cy="27" r="5" fill="#6f6f60"/>    </symbol>
    <use href="#x-icon-n-w-overlay" x="-19" y="-19" width="38" height="38" />
  </g>
  <g transform="translate(16,-16) scale(0.0625)">
    <use href="#x-icon-n-w" x="-20" y="-20" width="40" height="40" /> 
    <use href="#x-icon-n-w-overlay" x="-19" y="-19" width="38" height="38" />
  </g>
  `;

  document.getElementById("icon-scene").innerHTML = ICON;
</script>
</body>
</html>
