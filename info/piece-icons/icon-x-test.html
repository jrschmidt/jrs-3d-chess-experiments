<!doctype html>

<!--              Simple HTML page to display a piece icon               -->
<!--           Shows a large version and an actual size version          -->
<!-- Substitute the code in the SVG <g> tag to display a different icon  -->

<html lang="en">
<head>
<meta charset="utf-8">
<title>Icon Preview</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #2f3f4f;
  }
  svg {
    display: block;
    width: 50vw;
    height: 50vw;
    margin: 0 auto;
  }
</style>
</head>
<body>
<svg id="icon-scene" viewBox="-20 -20 40 40" preserveAspectRatio="xMidYMid meet"></svg>
<script>
  // Hardcode ICON to preview a different piece icon, prototype, or in-progress change.

  // This is the baseline version. Replace the text of the first <g> tag with your own code.
  const ICON = `
    <g>
      <symbol id="x-icon-proto" viewBox="-20 -20 40 40">
        <circle cx="0" cy="0" r="19" fill="#6f6f60" stroke="#000000" stroke-width="2" />
      </symbol>
      <use href="#x-icon-proto" x="-20" y="-20" width="40" height="40" />
      <symbol id="x-icon-proto-overlay" viewBox="0 0 100 100">
        <path d="M 50 20 L 80 50 L 50 80 L 20 50 Z" fill="#ffffff" />
      </symbol>
      <use href="#x-icon-proto-overlay" x="-19" y="-19" width="38" height="38" />
    </g>
    <g transform="translate(16,-16) scale(0.0625)">
      <use href="#x-icon-proto" x="-20" y="-20" width="40" height="40" />
      <use href="#x-icon-proto-overlay" x="-19" y="-19" width="38" height="38" />
    </g>
  `;

  document.getElementById("icon-scene").innerHTML = ICON;
</script>
</body>
</html>
