<!doctype html>

<!--              Simple HTML page to display a piece icon               -->
<!--           Shows a large version and an actual size version          -->
<!-- Substitute the code in the SVG <g> tag to display a different icon  -->

<html lang="en">
<head>
<meta charset="utf-8">
<title>Icon Preview</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #2f3f4f;
  }
  svg {
    display: block;
    width: 50vw;
    height: 50vw;
    margin: 0 auto;
  }
</style>
</head>
<body>
<svg id="icon-scene" viewBox="-20 -20 40 40" preserveAspectRatio="xMidYMid meet"></svg>
<script>

  // White Zebra version 2.
const ICON = `
  <g>
    <symbol id="x-icon-z-b" viewBox="-20 -20 40 40">
      <circle cx="0" cy="0" r="19" fill="#6f6f60" stroke="#000000" stroke-width="2" />
    </symbol>
    <use href="#x-icon-z-b" x="-20" y="-20" width="40" height="40" />
    <symbol id="x-icon-z-b-overlay" viewBox="0 0 100 100">
      <path
        d="M 80 85 L 25 85 L 10 65 L 10 50 A 35 35 0 0 1 50 18
          A 6 6 0 1 1 60 18 A 15 15 0 0 1 80 25 L 93 42
          A 10 10 0 0 1 78 55 L 65 45 L 50 45 L 46 55 L 70 70 Z"
        fill="#cccccc"
      />
      <circle cx="68" cy="27" r="5" fill="#6f6f60"/>
      <polygon
        points="48,41 57,41 34,21 29,25"
        fill="#6f6f60"
      />
      <polygon
        points="42,56 44,50 15,43 13,50"
        fill="#6f6f60"
      />
      <polygon
        points="59,67 53,63 20,75 25,80"
        fill="#6f6f60"
      />
    </symbol>
    <use href="#x-icon-z-b-overlay" x="-19" y="-19" width="38" height="38" />
  </g>
  <g transform="translate(16,-16) scale(0.0625)">
    <use href="#x-icon-z-b" x="-20" y="-20" width="40" height="40" /> 
    <use href="#x-icon-z-b-overlay" x="-19" y="-19" width="38" height="38" />
  </g>
  `;

  document.getElementById("icon-scene").innerHTML = ICON;
</script>
</body>
</html>
